name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: neerai/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: neerai/backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check app --select E9,F
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerabilities (runtime requirements)
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: neerai/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: neerai/frontend/package-lock.json }
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Tests
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Dependency vulnerabilities (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the real Lambda package (Linux wheels, Docker-free) and check its size
        run: python neerai/scripts/build_lambda.py
      - name: Synthesize (placeholder account/origin; nothing is deployed)
        working-directory: neerai/infrastructure/cdk
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_CONTEXT_JSON: '{"stage":"dev","region":"ap-south-1","frontendOrigin":"https://main.d1example.amplifyapp.com"}'
          CDK_OUTDIR: cdk.out
        run: |
          pip install -r requirements.txt
          python app.py
          test -s cdk.out/NeerAI-Dev.template.json
      - name: Template policy checks (no wildcard IAM actions, no public resources)
        run: python neerai/infrastructure/cdk/check_template.py neerai/infrastructure/cdk/cdk.out/NeerAI-Dev.template.json
